name: Worker release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lovechapter-worker-release
  cancel-in-progress: false
  queue: max

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: npm ci
      - run: npm run ci

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lovechapter_test
          POSTGRES_USER: lovechapter_test
          POSTGRES_PASSWORD: ci_only_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lovechapter_test -d lovechapter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: PostgreSQL integration
        env:
          TEST_DATABASE_URL: postgres://lovechapter_test:ci_only_disposable@127.0.0.1:5432/lovechapter_test
          TEST_DATABASE_CONFIRM: lovechapter_test
          TEST_GATE_APP_DATABASE_URL: postgres://lovechapter_gate_test_app:ci_only_disposable@127.0.0.1:5432/lovechapter_test
        run: npm run test:postgres --workspace @lovechapter/database
      - name: Scheduled email retry integration
        env:
          TEST_DATABASE_URL: postgres://lovechapter_test:ci_only_disposable@127.0.0.1:5432/lovechapter_test
          TEST_DATABASE_CONFIRM: lovechapter_test
        run: npm run test:postgres --workspace @lovechapter/jobs

  staging:
    needs: [ci, postgres]
    if: ${{ github.ref == 'refs/heads/main' && github.ref_protected == true && vars.STAGING_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
    outputs:
      accepted_sha: ${{ steps.release.outputs.accepted_sha }}
      acceptance: ${{ steps.release.outputs.acceptance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: npm ci
      - id: release
        name: Guarded staging release
        env:
          STAGING_RELEASE_ENABLED: ${{ vars.STAGING_RELEASE_ENABLED }}
          RELEASE_ENVIRONMENT: staging
          RELEASE_NEON_PROJECT_ID: ${{ vars.RELEASE_NEON_PROJECT_ID }}
          RELEASE_NEON_BRANCH_ID: ${{ vars.RELEASE_NEON_BRANCH_ID }}
          RELEASE_DATABASE_NAME: ${{ vars.RELEASE_DATABASE_NAME }}
          RELEASE_DATABASE_ROLE: ${{ vars.RELEASE_DATABASE_ROLE }}
          RELEASE_APP_DATABASE_ROLE: ${{ vars.RELEASE_APP_DATABASE_ROLE }}
          RELEASE_MIGRATION_DATABASE_ROLE: ${{ vars.RELEASE_MIGRATION_DATABASE_ROLE }}
          RELEASE_CLOUDFLARE_ACCOUNT_ID: ${{ vars.RELEASE_CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_HYPERDRIVE_ID: ${{ vars.RELEASE_HYPERDRIVE_ID }}
          RELEASE_WEB_ORIGIN: ${{ vars.RELEASE_WEB_ORIGIN }}
          RELEASE_API_ORIGIN: ${{ vars.RELEASE_API_ORIGIN }}
          RELEASE_DATABASE_URL: ${{ secrets.RELEASE_DATABASE_URL }}
          RELEASE_MIGRATION_DATABASE_URL: ${{ secrets.RELEASE_MIGRATION_DATABASE_URL }}
          RELEASE_NEON_API_KEY: ${{ secrets.RELEASE_NEON_API_KEY }}
          RELEASE_CLOUDFLARE_API_TOKEN: ${{ secrets.RELEASE_CLOUDFLARE_API_TOKEN }}
          WEB_PROXY_SHARED_SECRET: ${{ secrets.WEB_PROXY_SHARED_SECRET }}
          RELEASE_PROBE_SECRET: ${{ secrets.RELEASE_PROBE_SECRET }}
          RELEASE_TEST_EMAIL: ${{ secrets.RELEASE_TEST_EMAIL }}
          RELEASE_TEST_PASSWORD: ${{ secrets.RELEASE_TEST_PASSWORD }}
          RELEASE_VERIFICATION_EMAIL: ${{ secrets.RELEASE_VERIFICATION_EMAIL }}
          RELEASE_FOREIGN_WEDDING_ID: ${{ vars.RELEASE_FOREIGN_WEDDING_ID }}
          RELEASE_TEST_DATABASE_URL: ${{ secrets.RELEASE_TEST_DATABASE_URL }}
          RELEASE_TEST_BRANCH_ID: ${{ vars.RELEASE_TEST_BRANCH_ID }}
          RELEASE_TEST_DATABASE_CONFIRM: lovechapter_test
          RELEASE_POSTGRES_JOB_RESULT: ${{ needs.postgres.result }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-cli.mjs staging

  production:
    needs: [staging]
    if: ${{ github.ref == 'refs/heads/main' && github.ref_protected == true && vars.PRODUCTION_RELEASE_ENABLED == 'true' && needs.staging.outputs.accepted_sha == github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: npm ci
      - name: Guarded production release
        env:
          PRODUCTION_RELEASE_ENABLED: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
          RELEASE_ENVIRONMENT: production
          RELEASE_STAGING_SHA: ${{ needs.staging.outputs.accepted_sha }}
          RELEASE_STAGING_ACCEPTANCE: ${{ needs.staging.outputs.acceptance }}
          RELEASE_NEON_PROJECT_ID: ${{ vars.RELEASE_NEON_PROJECT_ID }}
          RELEASE_NEON_BRANCH_ID: ${{ vars.RELEASE_NEON_BRANCH_ID }}
          RELEASE_DATABASE_NAME: ${{ vars.RELEASE_DATABASE_NAME }}
          RELEASE_DATABASE_ROLE: ${{ vars.RELEASE_DATABASE_ROLE }}
          RELEASE_APP_DATABASE_ROLE: ${{ vars.RELEASE_APP_DATABASE_ROLE }}
          RELEASE_MIGRATION_DATABASE_ROLE: ${{ vars.RELEASE_MIGRATION_DATABASE_ROLE }}
          RELEASE_CLOUDFLARE_ACCOUNT_ID: ${{ vars.RELEASE_CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_HYPERDRIVE_ID: ${{ vars.RELEASE_HYPERDRIVE_ID }}
          RELEASE_WEB_ORIGIN: ${{ vars.RELEASE_WEB_ORIGIN }}
          RELEASE_API_ORIGIN: ${{ vars.RELEASE_API_ORIGIN }}
          RELEASE_DATABASE_URL: ${{ secrets.RELEASE_DATABASE_URL }}
          RELEASE_MIGRATION_DATABASE_URL: ${{ secrets.RELEASE_MIGRATION_DATABASE_URL }}
          RELEASE_NEON_API_KEY: ${{ secrets.RELEASE_NEON_API_KEY }}
          RELEASE_CLOUDFLARE_API_TOKEN: ${{ secrets.RELEASE_CLOUDFLARE_API_TOKEN }}
          WEB_PROXY_SHARED_SECRET: ${{ secrets.WEB_PROXY_SHARED_SECRET }}
          RELEASE_PROBE_SECRET: ${{ secrets.RELEASE_PROBE_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-cli.mjs production

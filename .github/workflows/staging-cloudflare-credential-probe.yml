name: Staging Cloudflare credential probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.repository == 'akephisit/lovechapter' && github.ref == 'refs/heads/main' && github.ref_protected == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Read staging Cloudflare target metadata
        env:
          RELEASE_CLOUDFLARE_ACCOUNT_ID: ${{ vars.RELEASE_CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_HYPERDRIVE_ID: ${{ vars.RELEASE_HYPERDRIVE_ID }}
          RELEASE_CLOUDFLARE_API_TOKEN: ${{ secrets.RELEASE_CLOUDFLARE_API_TOKEN }}
        run: node scripts/staging-cloudflare-credential-probe.mjs

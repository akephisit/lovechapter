name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A production migration must finish before another main-branch release starts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          test "$(bun --version)" = "1.4.2"

      - name: Install dependencies
        run: npm ci

      - name: Run repository CI gate
        run: npm run ci

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lovechapter_test
          POSTGRES_USER: lovechapter_test
          POSTGRES_PASSWORD: ci_only_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lovechapter_test -d lovechapter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://lovechapter_test:ci_only_disposable@127.0.0.1:5432/lovechapter_test
          TEST_DATABASE_CONFIRM: lovechapter_test
        run: npm run test:postgres --workspace @lovechapter/database

  deploy-production:
    name: Migrate and deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, postgres-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check production configuration
        env:
          NEON_MIGRATION_DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_WORKER_ORIGIN: ${{ vars.API_WORKER_ORIGIN }}
          WEB_WORKER_ORIGIN: ${{ vars.WEB_WORKER_ORIGIN }}
        run: |
          set -euo pipefail
          for name in NEON_MIGRATION_DATABASE_URL CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN API_WORKER_ORIGIN WEB_WORKER_ORIGIN; do
            if [[ -z "${!name:-}" ]]; then
              printf 'Missing production setting: %s\n' "$name" >&2
              exit 1
            fi
          done
          if rg -q 'REPLACE_WITH_HYPERDRIVE_ID' apps/api/wrangler.jsonc; then
            printf 'Set the production Hyperdrive ID before deploying.\n' >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Apply pending production migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
        run: npm run db:migrate --workspace @lovechapter/database

      - name: Deploy API Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:worker --workspace @lovechapter/api

      - name: Deploy web Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy --workspace @lovechapter/web

      - name: Check deployed health
        env:
          API_WORKER_ORIGIN: ${{ vars.API_WORKER_ORIGIN }}
          WEB_WORKER_ORIGIN: ${{ vars.WEB_WORKER_ORIGIN }}
        run: |
          curl --fail --show-error --silent --retry 4 --retry-delay 3 "$API_WORKER_ORIGIN/health/live"
          curl --fail --show-error --silent --retry 4 --retry-delay 3 "$WEB_WORKER_ORIGIN/api/health/ready"
